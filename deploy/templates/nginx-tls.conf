# Port 443: the page, the API and the relay. Rendered once the certificate
# exists (deploy/steps/nginx.sh). Written for nginx 1.24 (Ubuntu 24.04).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TLS settings sit in each server block: Ubuntu's nginx.conf already sets
# ssl_protocols and ssl_prefer_server_ciphers at the http level, and a second
# setting there would be a duplicate.

# The page, NIP-05 names and calendar pages: all served by the API process,
# with a static page while it is down.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};
    access_log /var/log/nginx/access.log eventindex;
    ssl_certificate     /etc/letsencrypt/live/eventindex/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventindex/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eventindex:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 64k;
    root ${SITE_DIR};

    location / {
        proxy_pass http://127.0.0.1:${API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        error_page 502 503 504 /offline.html;
    }

    location = /offline.html {
        internal;
    }
}

# The API.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${API_HOST};
    access_log /var/log/nginx/access.log eventindex;
    ssl_certificate     /etc/letsencrypt/live/eventindex/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventindex/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eventindex:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:${API_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# The relay: WebSocket (and NIP-11 over plain HTTP) to strfry.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${RELAY_HOST};
    access_log /var/log/nginx/access.log eventindex;
    ssl_certificate     /etc/letsencrypt/live/eventindex/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventindex/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eventindex:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:${RELAY_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
