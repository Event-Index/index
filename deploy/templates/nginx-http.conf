# Port 80: Let's Encrypt challenges, and a redirect to HTTPS for the rest.
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} ${API_HOST} ${RELAY_HOST};

    location /.well-known/acme-challenge/ {
        root ${ACME_DIR};
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
