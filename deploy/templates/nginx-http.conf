# Visitors' addresses are not logged: this format, used by every server
# block, has none (the error log still names the client of a failed request).
log_format eventindex '$time_iso8601 $host "$request" $status $body_bytes_sent $request_time';

# Port 80: Let's Encrypt challenges, and a redirect to HTTPS for the rest.
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} ${API_HOST} ${RELAY_HOST};
    access_log /var/log/nginx/access.log eventindex;

    location /.well-known/acme-challenge/ {
        root ${ACME_DIR};
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
